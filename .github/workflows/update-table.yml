name: Aktualizace tabulky

on:
  schedule:
    # GitHub Actions umí plánovat jen v UTC, ne v českém čase.
    # Cíl: úterý a čtvrtek ve 12:00 českého času.
    # SEČ (zima, UTC+1) → 12:00 CET = 11:00 UTC
    # SELČ (léto, UTC+2) → 12:00 CEST = 10:00 UTC
    # dny v týdnu: 2=úterý, 4=čtvrtek. Skript nic nezapíše, pokud se
    # od poslední aktualizace nic nezměnilo, takže dvojí spuštění nevadí.
    - cron: '0 11 * * 2,4'   # ~12:00 SEČ (zima) - úterý a čtvrtek
    - cron: '0 10 * * 2,4'   # ~12:00 SELČ (léto) - úterý a čtvrtek
  workflow_dispatch: {}       # umožní i ruční spuštění tlačítkem na GitHubu

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalace závislostí
        run: pip install requests beautifulsoup4

      - name: Stažení a aktualizace tabulky
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python scripts/update_table.py

      - name: Uložení změny (pokud nějaká je)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Automatická aktualizace tabulky"
          git push
