name: Aktualizace tabulky

on:
  schedule:
    # GitHub Actions umí plánovat jen v UTC, ne v českém čase.
    # Cíl: každý den v 10:00 českého času.
    # SEČ (zima, UTC+1) → 10:00 CET = 09:00 UTC
    # SELČ (léto, UTC+2) → 10:00 CEST = 08:00 UTC
    # Skript nic nezapíše, pokud se od poslední aktualizace nic
    # nezměnilo, takže dvojí spuštění týž den nevadí.
    - cron: '0 9 * * *'    # ~10:00 SEČ (zima) - každý den
    - cron: '0 8 * * *'    # ~10:00 SELČ (léto) - každý den
  workflow_dispatch: {}     # umožní i ruční spuštění přímo na GitHubu

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalace závislostí
        run: pip install requests beautifulsoup4

      - name: Stažení a aktualizace tabulky
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python scripts/update_table.py

      - name: Uložení změny (pokud nějaká je)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Automatická aktualizace tabulky"
          git push
